name: Differ
description: Report the package diff of a Vanilla OS image to a differ instance

branding:
  icon: layers
  color: blue

inputs:
  image:
    description: Primary image name registered in differ (e.g. gnome)
    required: true
  legacy_image:
    description: Legacy/compatibility image name registered in differ (e.g. desktop). Leave empty to skip it.
    required: false
    default: ''
  differ_url:
    description: Base URL of the differ instance (e.g. ${{ vars.DIFFER_URL }})
    required: true
  differ_user:
    description: differ basic auth user
    required: true
  differ_psw:
    description: differ basic auth password
    required: true
  packages_owner:
    description: Owner of the container package on GitHub. Defaults to the repository owner.
    required: false
    default: ''
  package_list_script:
    description: Script that prints the package list JSON fragment
    required: false
    default: .github/gen_package_list.sh

outputs:
  digest:
    description: Digest of the image reported to differ
    value: ${{ steps.diff.outputs.digest }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        DIFFER_URL: ${{ inputs.differ_url }}
        DIFFER_USER: ${{ inputs.differ_user }}
        DIFFER_PSW: ${{ inputs.differ_psw }}
        PACKAGE_OWNER: ${{ inputs.packages_owner || github.repository_owner }}
        IMAGE: ${{ inputs.image }}
        LEGACY_IMAGE: ${{ inputs.legacy_image }}
        PACKAGE_LIST_SCRIPT: ${{ inputs.package_list_script }}
      run: |
        lpkg --unlock
        PACKAGE_LIST=$("$PACKAGE_LIST_SCRIPT")
        apt-get install -y curl
        IMAGE_DIGEST=$(curl -s -L -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${{ github.token }}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/orgs/${PACKAGE_OWNER}/packages/container/${IMAGE}/versions" | grep -m1 name | sed -E 's/^\s*"name": "(.+)".*$/\1/')
        for target in ${LEGACY_IMAGE:+"$LEGACY_IMAGE"} "$IMAGE"; do
          curl -X POST \
          -H 'Accept:application/json' \
          -H "Authorization:Basic $(echo -n "${DIFFER_USER}:${DIFFER_PSW}" | base64)" \
          -d "{\"digest\":\"${IMAGE_DIGEST}\",${PACKAGE_LIST}}" \
          "${DIFFER_URL}/images/${target}/new"
        done
        lpkg --lock
        echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
